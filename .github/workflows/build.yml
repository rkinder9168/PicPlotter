name: Build Installers

on:
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version and create release
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/__init__.py)
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release delete "$tag" --yes 2>/dev/null || true
          git push --delete origin "$tag" 2>/dev/null || true
          gh release create "$tag" \
            --title "PicPlotter Auto $tag" \
            --notes "Automated build of PicPlotter Auto ${version}" \
            --latest

  windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build app
        run: python build/build.py
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: powershell
        run: |
          $version = "${{ needs.create-release.outputs.version }}" -replace '-auto$',''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version packaging\windows\PicPlotterAuto.iss
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" dist/installer/*.exe --repo "${{ github.repository }}"

  macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system deps
        run: brew install libheif
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Build app
        run: python3 build/build.py
      - name: Build DMG
        run: bash packaging/macos/build_dmg.sh
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" dist/*.dmg --repo "${{ github.repository }}"
